<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14111f">
  <title>Idle Realms</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="layout">
    <aside id="sidebar">
      <div class="brand"><span>⚔️</span> Idle Realms</div>
      <nav id="nav"></nav>
    </aside>
    <div id="scrim"></div>

    <div id="main">
      <header id="topbar">
        <div class="tb-row">
          <button id="menu-btn" aria-label="Menu">☰</button>
          <div id="page-title"></div>
          <div id="total-level" title="Total skill level"></div>
        </div>
        <div class="res-row">
          <div class="res" title="Gold">🪙 <span id="r-gold">0</span></div>
          <div class="res" title="Hero EXP">✨ <span id="r-exp">0</span></div>
          <div class="res" title="Gems">💎 <span id="r-gems">0</span></div>
          <div class="res" title="Summon Scrolls">📜 <span id="r-scrolls">0</span></div>
        </div>
        <button id="active-strip" class="hidden"></button>
      </header>
      <main id="screen"></main>
    </div>
  </div>

  <div id="battle" class="hidden">
    <div class="battle-head">
      <div id="battle-title">Stage 1</div>
      <div id="battle-timer">90</div>
      <div class="battle-ctrl">
        <button id="btn-speed">1x</button>
        <button id="btn-skip">Skip ⏭</button>
      </div>
    </div>
    <div id="battle-info"></div>
    <div id="field">
      <div class="side enemy">
        <div class="row back"></div>
        <div class="row front"></div>
      </div>
      <div class="vs-line"></div>
      <div class="side ally">
        <div class="row front"></div>
        <div class="row back"></div>
      </div>
    </div>
  </div>

  <div id="modal" class="hidden"><div class="modal-card" id="modal-card"></div></div>
  <div id="toast" class="hidden"></div>

  <script src="js/data.js"></script>
  <script src="js/skilldata.js"></script>
  <script src="js/state.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
