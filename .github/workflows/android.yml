name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']   # a version tag publishes a numbered test release
    paths: ['index.html', 'styles.css', 'js/**', 'assets/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

# One build publishes at a time, so two pushes can't race on the same release.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use the private signing key (if the repository has one)
        env:
          IR_KEYSTORE_B64: ${{ secrets.IR_KEYSTORE_B64 }}
        if: env.IR_KEYSTORE_B64 != ''
        run: |
          echo "$IR_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "IR_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          IR_KEYSTORE_PASSWORD: ${{ secrets.IR_KEYSTORE_PASSWORD }}
          IR_KEY_ALIAS: ${{ secrets.IR_KEY_ALIAS }}
          IR_KEY_PASSWORD: ${{ secrets.IR_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk IdleRealms.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IdleRealms-apk
          path: IdleRealms.apk
      - name: Publish the versioned test release (v<versionName>)
        # Uses the app version from android/app/build.gradle; creates the release (and its tag) the
        # first time, and refreshes the APK on later builds of the same version.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="v$(grep -oP "versionName '\\K[^']+" android/app/build.gradle)"
          if gh release view "$VER" >/dev/null 2>&1; then
            gh release upload "$VER" IdleRealms.apk --clobber
          else
            gh release create "$VER" IdleRealms.apk --prerelease --target "$GITHUB_SHA" \
              --title "Idle Realms $VER (test build)" \
              --notes "Test build $VER for Android. Download IdleRealms.apk on your phone and open it to install. Updates install over earlier builds and keep your save."
          fi
      - name: Publish to the "android-latest" release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest IdleRealms.apk --prerelease \
            --target "$GITHUB_SHA" --title "Idle Realms (latest Android build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download IdleRealms.apk on your phone and install it."
