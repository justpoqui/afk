name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']   # a version tag publishes a numbered test release
    paths: ['index.html', 'styles.css', 'js/**', 'assets/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk IdleRealms.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IdleRealms-apk
          path: IdleRealms.apk
      - name: Publish the tagged test release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes || true
          gh release create "$GITHUB_REF_NAME" IdleRealms.apk --prerelease \
            --title "Idle Realms $GITHUB_REF_NAME (test build)" \
            --notes "Test build $GITHUB_REF_NAME for Android. Download IdleRealms.apk on your phone and open it to install. Updates install over earlier builds and keep your save."
      - name: Publish to the "android-latest" release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest IdleRealms.apk --prerelease \
            --target "$GITHUB_SHA" --title "Idle Realms (latest Android build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download IdleRealms.apk on your phone and install it."
